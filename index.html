<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mundo explorável</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #hud { position: fixed; left: 12px; bottom: 12px; margin: 0; padding: 8px 10px; color: #dfe6ff; font: 12px/1.5 monospace; background: #0009; border-radius: 6px; pointer-events: none; white-space: pre; }
      #divider { position: fixed; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff8; display: none; pointer-events: none; }
      #hint { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; text-shadow: 0 0 6px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="hint">Clique para controlar a câmera (Esc libera o mouse)</div>
    <div id="divider"></div>
    <pre id="hud"></pre>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
